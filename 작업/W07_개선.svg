<svg xmlns="http://www.w3.org/2000/svg" width="2354" height="1162" viewBox="0 0 2354 1162" role="img" aria-labelledby="title desc">
  <title id="title">W07 판매장려금 지급 개선 BPMN</title>
  <desc id="desc">영업지원이 직접 입력과 CSV 요청을 묶어서 접수한다. 미정 예정일은 정산월과 과거 지급월 간격·평일 순번으로 추천하고, 저장 전 월 합산을 확인한다. 대리점 마스터·장려금 지급표·채권 회수 이력의 필드를 규칙 대조하고 정상 자료는 자동 검토, 예외는 NIM 권고 후 회계가 확인한다. 특별승인은 영업 임원과 재무 임원의 동일 버전 결재가 모두 필요하다. 추가 판단이 필요하면 지급을 보류하고 AI가 영업지원 보완 또는 회계 확인과 상위 보고로 연결한다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#425773"/></marker></defs>
