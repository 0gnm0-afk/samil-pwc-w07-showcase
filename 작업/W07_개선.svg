  <title id="title">W07 판매장려금 지급 개선 BPMN</title>
  <desc id="desc">영업지원이 직접 입력과 CSV 요청을 묶어서 접수한다. 회계가 근거를 검토한다. 특별승인은 영업 임원과 재무 임원의 동일 버전 결재가 모두 필요하다. 추가 판단이 필요하면 지급을 보류하고 AI가 영업지원 보완 또는 회계 확인과 상위 보고로 연결한다.</desc>
